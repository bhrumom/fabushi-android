name: Android Parity Full CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  architecture-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate frozen inventory and current ledger
        run: python scripts/check_grok_android_parity.py
      - name: Test architecture checker
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Run strict architecture gate and expose migration debt
        id: strict
        continue-on-error: true
        run: python scripts/check_grok_android_parity.py --strict
      - name: Record strict gate outcome
        run: |
          mkdir -p evidence
          printf 'head=%s\nstrict_outcome=%s\n' "$SOURCE_SHA" "${{ steps.strict.outcome }}" > evidence/architecture-gate.txt
      - name: Rust contract/runtime tests
        run: cargo test --workspace --all-targets
      - uses: actions/upload-artifact@v4
        with:
          name: architecture-contract-evidence-${{ env.SOURCE_SHA }}
          path: evidence/architecture-gate.txt
          if-no-files-found: error

  android-build-unit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, unit-test, lint, and compile instrumentation tests
        working-directory: mobile/android
        run: ./gradlew --no-daemon clean assembleDebug testDebugUnitTest lintDebug compileDebugAndroidTestKotlin
      - name: Record exact-HEAD APK identity
        working-directory: mobile/android
        run: |
          set -eu
          cp app/build/outputs/apk/debug/app-debug.apk "fabushi-android-${SOURCE_SHA}.apk"
          sha256sum "fabushi-android-${SOURCE_SHA}.apk" > "fabushi-android-${SOURCE_SHA}.apk.sha256"
          printf 'head=%s\n' "$SOURCE_SHA" > artifact-identity.txt
          cat "fabushi-android-${SOURCE_SHA}.apk.sha256" >> artifact-identity.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk-${{ env.SOURCE_SHA }}
          path: |
            mobile/android/fabushi-android-${{ env.SOURCE_SHA }}.apk
            mobile/android/fabushi-android-${{ env.SOURCE_SHA }}.apk.sha256
            mobile/android/artifact-identity.txt
          if-no-files-found: error

  android-emulator-instrumentation:
    needs: android-build-unit-lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-debug-apk-${{ env.SOURCE_SHA }}
          path: exact-head-apk
      - name: Verify downloaded exact-HEAD APK identity
        run: |
          set -eu
          test -f "exact-head-apk/fabushi-android-${SOURCE_SHA}.apk"
          test -f "exact-head-apk/fabushi-android-${SOURCE_SHA}.apk.sha256"
          (cd exact-head-apk && sha256sum -c "fabushi-android-${SOURCE_SHA}.apk.sha256")
          grep -F "head=${SOURCE_SHA}" exact-head-apk/artifact-identity.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: mobile/android
          script: |
            set -eu
            PACKAGE=com.ombhrum.fabushi.debug
            TEST_PACKAGE=com.ombhrum.fabushi.debug.test
            APK="../../exact-head-apk/fabushi-android-${SOURCE_SHA}.apk"
            EVIDENCE=../../evidence/emulator
            mkdir -p "$EVIDENCE"

            ./gradlew --no-daemon assembleDebugAndroidTest
            adb uninstall "$PACKAGE" >/dev/null 2>&1 || true
            adb install "$APK"
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r "$TEST_PACKAGE/androidx.test.runner.AndroidJUnitRunner"               | tee "$EVIDENCE/instrumentation.txt"
            grep -q "OK (" "$EVIDENCE/instrumentation.txt"

            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 3
            PID_BEFORE="$(adb shell pidof "$PACKAGE" | tr -d '\r')"
            test -n "$PID_BEFORE"
            adb shell run-as "$PACKAGE" cat shared_prefs/fabushi-coordinator-runtime.xml > "$EVIDENCE/coordinator-before.xml"
            GEN_BEFORE="$(sed -n 's/.*name="generation" value="\([0-9][0-9]*\)".*/\1/p' "$EVIDENCE/coordinator-before.xml" | head -n 1)"
            test -n "$GEN_BEFORE"

            adb shell am force-stop "$PACKAGE"
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 3
            PID_AFTER="$(adb shell pidof "$PACKAGE" | tr -d '\r')"
            test -n "$PID_AFTER"
            test "$PID_BEFORE" != "$PID_AFTER"
            adb shell run-as "$PACKAGE" cat shared_prefs/fabushi-coordinator-runtime.xml > "$EVIDENCE/coordinator-after.xml"
            GEN_AFTER="$(sed -n 's/.*name="generation" value="\([0-9][0-9]*\)".*/\1/p' "$EVIDENCE/coordinator-after.xml" | head -n 1)"
            test -n "$GEN_AFTER"
            test "$GEN_AFTER" -gt "$GEN_BEFORE"

            printf 'head=%s\npackage=%s\npid_before=%s\npid_after=%s\ngeneration_before=%s\ngeneration_after=%s\n'               "$SOURCE_SHA" "$PACKAGE" "$PID_BEFORE" "$PID_AFTER" "$GEN_BEFORE" "$GEN_AFTER"               > "$EVIDENCE/process-recreation.txt"
            sha256sum "$APK" > "$EVIDENCE/installed-apk.sha256"
            adb logcat -d > "$EVIDENCE/logcat.txt"
            adb exec-out screencap -p > "$EVIDENCE/relaunch.png"
            printf 'head=%s\npackage=%s\n' "$SOURCE_SHA" "$PACKAGE" > "$EVIDENCE/identity.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-evidence-${{ env.SOURCE_SHA }}
          path: evidence/emulator
          if-no-files-found: warn
